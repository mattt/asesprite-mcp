name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  check-latest: true
            - name: Check formatting
              run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
            - name: Vet
              run: go vet ./...
            - name: Test
              run: go test ./...
            - name: Build
              run: go build ./cmd/aseprite-mcp
